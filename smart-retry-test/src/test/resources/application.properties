
spring.profiles.active=daily
server.port=7006


spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/retry_task?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driverClassName= com.mysql.cj.jdbc.Driver


spring.smart-retry.mybatis.enabled=true
spring.smart-retry.mybatis.datasource=dataSource
spring.smart-retry.taskFindInterval=15
spring.smart-retry.executor.corePoolSize=10
spring.smart-retry.deadTask.deadTaskCheck= true
spring.smart-retry.deadTask.taskMaxExecuteTimeout= 3600
spring.smart-retry.scanPreloadMultiplier=10
spring.smart-retry.maxInMemory=10000
